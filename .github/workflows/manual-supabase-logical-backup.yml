name: Manual Supabase logical backup

on:
  workflow_dispatch:
    inputs:
      backup_label:
        description: Optional human-readable label
        required: false
        type: string

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.101.0

jobs:
  backup:
    name: Export roles, schema and data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
          github-token: ${{ github.token }}

      - name: Require database connection secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not configured as a GitHub Actions secret." >&2
            exit 1
          fi

      - name: Create logical backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_LABEL: ${{ inputs.backup_label }}
        run: bash scripts/security/create-supabase-logical-backup.sh

      - name: Verify backup bundle
        run: bash scripts/security/verify-supabase-logical-backup.sh backup

      - name: Upload private backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: tbg-supabase-logical-backup-${{ github.run_id }}
          path: backup/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
