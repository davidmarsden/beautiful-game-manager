[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # URL and publishable anon key are intentionally emitted by auth-config.js.
  # The service-role key must never be excluded from Netlify secret scanning.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[functions."lock-fixtures"]
  schedule = "*/5 * * * *"

[functions."run-fixtures"]
  schedule = "*/5 * * * *"

[functions."player-release-settlement"]
  schedule = "7 * * * *"

[functions."world-maintenance"]
  schedule = "17 * * * *"

[functions."scheduled-world-turn"]
  schedule = "*/15 * * * *"

# The Pink Final remains independently published from beautiful-game-data.
# Netlify proxies it under the public TBG product domain so users never need
# to see the GitHub Pages origin. Relative TPF assets and routes continue to
# work because the browser stays rooted at /pink-final/. Cache behaviour for
# these proxied responses is intentionally left to the upstream Pages origin.
[[redirects]]
  from = "/pink-final"
  to = "/pink-final/"
  status = 301

[[redirects]]
  from = "/pink-final/*"
  to = "https://davidmarsden.github.io/beautiful-game-data/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
