[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # URL and publishable anon key are intentionally emitted by auth-config.js.
  # The service-role key must never be excluded from Netlify secret scanning.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[functions."lock-fixtures"]
  schedule = "*/5 * * * *"

[functions."run-fixtures"]
  schedule = "*/5 * * * *"

[functions."player-release-settlement"]
  schedule = "7 * * * *"

[functions."world-maintenance"]
  schedule = "17 * * * *"

[functions."scheduled-world-turn"]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
