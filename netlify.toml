[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # URL and publishable anon key are intentionally emitted by auth-config.js.
  # The service-role key must never be excluded from Netlify secret scanning.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

# CENTRAL SCHEDULER REGISTRY — RECOVERY PAUSE 2026-09-28
#
# This is the sole authoritative location for automatic Netlify schedules.
# Function modules MUST NOT export config.schedule; test/schedulerTopology.test.js
# enforces that invariant.
#
# All triggers remain paused while the guarded scheduler architecture is deployed
# and a quiet post-outage baseline is observed. Previous production cadences:
#
# GAME-CRITICAL (restore without casual timing changes)
# lock-fixtures                         */5 * * * *
# run-fixtures                          */5 * * * *
# scheduled-world-turn                  */15 * * * *
#
# CHECKPOINT WRITER
# player-release-settlement             7 * * * *
#
# DERIVED REPAIR
# refresh-match-archives                */5 * * * *
# refresh-world-read-model              RETIRED — redundant
#
# BACKGROUND / SAFE TO STAGGER
# settle-transfers                      */5 * * * *
# manager-notification-email-scheduled  */5 * * * *
# manager-inactivity-checkin-scheduled  15 * * * *
# manager-inactivity-enforcement-scheduled 30 * * * *
# world-maintenance                     17 * * * *
#
# Restoration must add [functions."<name>"] schedule blocks HERE only.
# Restore low-cost/background jobs first and scheduled-world-turn last.

# The Pink Final now has its own canonical public origin. Preserve the old
# /pink-final namespace as a permanent route-preserving redirect so bookmarks
# and previously shared links keep working after the domain move.
[[redirects]]
  from = "/pink-final"
  to = "https://thepinkfinal.online/"
  status = 301
  force = true

[[redirects]]
  from = "/pink-final/*"
  to = "https://thepinkfinal.online/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
